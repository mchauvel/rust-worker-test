apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-worker.fullname" . }}
  labels:
    {{- include "task-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "task-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "task-worker.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "task-worker.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: task-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.http.port }}
              protocol: TCP
          env:
            - name: TASK_BACKEND
              value: {{ .Values.taskBackend | quote }}
            - name: HTTP_ADDR
              value: "0.0.0.0:{{ .Values.http.port }}"
            - name: WORKER_CONCURRENCY
              value: {{ .Values.workerConcurrency | quote }}
            - name: HELM_BIN
              value: {{ .Values.helm.bin | quote }}
            - name: HELM_TIMEOUT_SECS
              value: {{ .Values.helm.timeoutSeconds | quote }}
            - name: RUST_LOG
              value: {{ .Values.logging.rustLog | quote }}
            - name: FILE_TASK_DIR
              value: {{ .Values.fileTaskDir | quote }}
            - name: HOME
              value: /tmp
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: task-data
              mountPath: /var/lib/task-worker
      volumes:
        - name: tmp
          emptyDir: {}
        - name: task-data
          emptyDir: {}
